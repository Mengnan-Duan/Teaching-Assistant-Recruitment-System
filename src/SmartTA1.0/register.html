<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Smart-TA · Register</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,500;9..40,700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#1a1a2e;--surface:#f8f7f4;--card:#fff;--accent:#e63946;--primary:#457b9d;--primary-dark:#1d3557;--primary-soft:#e8f0f6;--muted:#8d99ae;--border:#e0ddd8;--radius:14px;--shadow:0 4px 24px rgba(26,26,46,.10);--font:"DM Sans",sans-serif;--display:"Playfair Display",serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--surface);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border-radius:var(--radius);padding:40px 36px;width:100%;max-width:460px;box-shadow:var(--shadow)}
h1{font-family:var(--display);font-size:1.9rem;color:var(--primary-dark);text-align:center;margin-bottom:4px}
.subtitle{text-align:center;color:var(--muted);font-size:.88rem;margin-bottom:28px}
.err-box{border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:.85rem;display:none;background:#f8d7da;border:1.5px solid #f5c6cb;color:#721c24}
.err-box.show{display:block}
.field{text-align:left;margin-bottom:14px}
.field label{display:block;font-size:.82rem;font-weight:600;margin-bottom:5px}
.field input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-family:var(--font);font-size:.9rem;outline:none;transition:border-color .2s;background:#fff}
.field input:focus{border-color:var(--primary)}
.role-section{margin-bottom:14px}
.role-section > label{display:block;font-size:.82rem;font-weight:600;margin-bottom:8px}
.role-checkboxes{display:flex;gap:10px;flex-wrap:wrap}
.role-checkboxes label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.85rem;font-weight:500;padding:8px 14px;border:1.5px solid var(--border);border-radius:8px;transition:.2s;background:#fff}
.role-checkboxes label:hover{border-color:var(--primary);background:var(--primary-soft)}
.role-checkboxes label input{margin:0}
.role-hint{color:var(--muted);font-size:.78rem;margin-top:4px}
.btn{width:100%;padding:12px;border-radius:8px;font-family:var(--font);font-size:.92rem;font-weight:600;cursor:pointer;transition:.2s;border:none;background:var(--primary);color:#fff;margin-top:6px}
.btn:hover{background:var(--primary-dark)}
.switch-link{margin-top:16px;text-align:center;font-size:.82rem;color:var(--muted)}
.switch-link a{color:var(--primary);font-weight:600;text-decoration:none}
.switch-link a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <h1>Create Account</h1>
  <p class="subtitle">Join Smart-TA · EBU6304 Group 37</p>

  <div class="err-box" id="errBox"></div>

  <form id="regForm" action="auth" method="POST">
    <input type="hidden" name="action" value="register"/>

    <div class="field">
      <label>Username *</label>
      <input type="text" name="username" id="username" placeholder="Choose a username" required/>
    </div>
    <div class="field">
      <label>Password *</label>
      <input type="password" name="password" id="password" placeholder="Create a password" required/>
    </div>
    <div class="field">
      <label>Confirm Password *</label>
      <input type="password" name="confirm" id="confirm" placeholder="Re-enter password" required/>
    </div>

    <div class="role-section">
      <label>Select your role(s) *</label>
      <div class="role-checkboxes">
        <label><input type="checkbox" name="roles" value="TA"/> TA</label>
        <label><input type="checkbox" name="roles" value="MO"/> MO</label>
        <label><input type="checkbox" name="roles" value="ADMIN"/> Admin</label>
      </div>
      <p class="role-hint">One account, multiple roles. You can switch roles after login.</p>
    </div>

    <button type="submit" class="btn">Create Account</button>
  </form>

  <p class="switch-link">Already have an account? <a href="login.html">Sign in</a></p>
</div>

<script>
var errMap = {missing:'Please fill in all fields.',mismatch:'Passwords do not match.',taken:'Username already taken.',roles:'Please select at least one role.'};
var params = new URLSearchParams(window.location.search);
var err = params.get('err');
if (err && errMap[err]) {
  document.getElementById('errBox').textContent = errMap[err];
  document.getElementById('errBox').classList.add('show');
}

document.getElementById('regForm').addEventListener('submit', function(e) {
  var pw = document.getElementById('password').value;
  var cf = document.getElementById('confirm').value;
  if (pw !== cf) {
    e.preventDefault();
    var box = document.getElementById('errBox');
    box.textContent = 'Passwords do not match.';
    box.classList.add('show');
  }
});
</script>
</body>
</html>
