<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Smart-TA · Login</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,500;9..40,700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#1a1a2e;--surface:#f8f7f4;--card:#fff;--accent:#e63946;--primary:#457b9d;--primary-dark:#1d3557;--primary-soft:#e8f0f6;--success:#2a9d8f;--success-soft:#e6f5f3;--muted:#8d99ae;--border:#e0ddd8;--radius:14px;--shadow:0 4px 24px rgba(26,26,46,.10);--font:"DM Sans",sans-serif;--display:"Playfair Display",serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--surface);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border-radius:var(--radius);padding:48px 40px;width:100%;max-width:460px;box-shadow:var(--shadow)}
h1{font-family:var(--display);font-size:2rem;color:var(--primary-dark);text-align:center;margin-bottom:4px}
h1 span{color:var(--accent)}
.subtitle{text-align:center;color:var(--muted);font-size:.88rem;margin-bottom:28px}
.msg-box,.err-box{border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:.85rem;text-align:left;display:none}
.msg-box{background:#d4edda;border:1.5px solid #b8dec9;color:#155724}
.err-box{background:#f8d7da;border:1.5px solid #f5c6cb;color:#721c24}
.msg-box.show,.err-box.show{display:block}
.field{text-align:left;margin-bottom:14px}
.field label{display:block;font-size:.82rem;font-weight:600;margin-bottom:5px}
.field input,.field select{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-family:var(--font);font-size:.9rem;outline:none;transition:border-color .2s;background:#fff}
.field input:focus,.field select:focus{border-color:var(--primary)}
.role-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:4px}
.role-card{border:2px solid var(--border);border-radius:10px;padding:12px 8px;text-align:center;cursor:pointer;transition:.2s;font-size:.82rem;font-weight:600;position:relative}
.role-card:hover{border-color:var(--primary);background:var(--primary-soft)}
.role-card input{position:absolute;opacity:0;width:0;height:0}
.role-card.selected{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.btn{width:100%;padding:12px;border-radius:8px;font-family:var(--font);font-size:.92rem;font-weight:600;cursor:pointer;transition:.2s;border:none;background:var(--primary);color:#fff}
.btn:hover{background:var(--primary-dark)}
.switch-link{margin-top:18px;text-align:center;font-size:.82rem;color:var(--muted)}
.switch-link a{color:var(--primary);font-weight:600;text-decoration:none}
.switch-link a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <h1>Smart<span>TA</span></h1>
  <p class="subtitle">BUPT TA Recruitment System · EBU6304 Group 37</p>

  <div class="err-box" id="errBox"></div>
  <div class="msg-box" id="msgBox"></div>

  <form id="loginForm" action="auth" method="POST">
    <input type="hidden" name="action" value="login"/>

    <div class="field">
      <label>Username</label>
      <input type="text" id="username" name="username" placeholder="e.g. admin" autocomplete="username" required/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required/>
    </div>
    <div class="field">
      <label>Sign in as</label>
      <div class="role-grid">
        <label class="role-card" id="cardTA"><input type="radio" name="role" value="TA" checked/> Teaching Assistant</label>
        <label class="role-card" id="cardMO"><input type="radio" name="role" value="MO"/> Module Organiser</label>
        <label class="role-card" id="cardADMIN"><input type="radio" name="role" value="ADMIN"/> Administrator</label>
      </div>
    </div>

    <button type="submit" class="btn">Sign In</button>
  </form>

  <p class="switch-link">No account? <a href="register.html">Register here</a></p>
</div>

<script>
function getParam(k) {
  var params = new URLSearchParams(window.location.search);
  return params.get(k);
}

var errMap = {missing:'Please fill in all fields.',credentials:'Invalid username or password.',noaccess:'You do not have access to that role.',taken:'Username already taken.',mismatch:'Passwords do not match.',roles:'Please select at least one role.'};
var err = getParam('err');
if (err && errMap[err]) {
  document.getElementById('errBox').textContent = errMap[err];
  document.getElementById('errBox').classList.add('show');
}
var msg = getParam('msg');
if (msg === 'registered') {
  document.getElementById('msgBox').textContent = 'Account created! Please sign in.';
  document.getElementById('msgBox').classList.add('show');
}

document.querySelectorAll('.role-card input').forEach(function(input) {
  input.addEventListener('change', function() {
    document.querySelectorAll('.role-card').forEach(function(c) { c.classList.remove('selected'); });
    if (input.checked) input.closest('.role-card').classList.add('selected');
  });
  if (input.checked) input.closest('.role-card').classList.add('selected');
});
</script>
</body>
</html>
